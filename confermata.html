<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Email confermata · Fawr in Paris</title>
<style>
  :root { --bg:#000; --fg:#FAFAFA; --muted:#A8A8A8; --accent:#0A84FF; --card:#0A0A0A; --border:#2A2A2A; }
  @media (prefers-color-scheme: light) { :root { --bg:#fff; --fg:#000; --muted:#737373; --card:#fff; --border:#DBDBDB; } }
  * { box-sizing:border-box }
  body { margin:0; background:var(--bg); color:var(--fg); font-family:-apple-system,system-ui,"Segoe UI",Roboto,sans-serif; min-height:100vh; display:flex; align-items:center; justify-content:center; padding:24px }
  .card { max-width:420px; width:100%; text-align:center; display:flex; flex-direction:column; gap:14px; align-items:center }
  .f { width:72px; height:72px; border-radius:24px; background:var(--fg); color:var(--bg); display:grid; place-items:center; font-size:46px; font-weight:800; font-style:italic; transform:rotate(-6deg) }
  h1 { font-size:24px; margin:8px 0 0; letter-spacing:-.3px }
  p { color:var(--muted); line-height:1.5; margin:0; font-size:15px }
  a.btn { display:inline-block; margin-top:8px; background:var(--accent); color:#fff; text-decoration:none; font-weight:600; padding:14px 22px; border-radius:14px; font-size:16px }
  .small { font-size:13px }
  .lang { display:flex; gap:10px; justify-content:center; margin-top:18px }
  .lang button { background:none; border:1px solid var(--border); color:var(--muted); border-radius:999px; padding:6px 12px; font-size:13px; cursor:pointer }
  .lang button[aria-pressed="true"] { color:var(--fg); border-color:var(--fg) }
</style>
</head>
<body>
  <main class="card">
    <div class="f" aria-hidden="true">ƒ</div>
    <h1 data-i="t">Email confermata</h1>
    <p data-i="p">Il tuo account Fawr in Paris è attivo. Torna all'app e accedi: la mappa ti aspetta.</p>
    <a class="btn" href="fawraparis://login" data-i="b">Apri l'app</a>
    <p class="small" data-i="s">Se il bottone non funziona, apri l'app Fawr in Paris dal telefono e accedi con la tua email.</p>
    <div class="lang" role="group" aria-label="Lingua">
      <button data-l="it" aria-pressed="true">IT</button><button data-l="fr">FR</button><button data-l="en">EN</button>
    </div>
  </main>
<script>
  var T = {
    it:{t:"Email confermata",p:"Il tuo account Fawr in Paris è attivo. Torna all'app e accedi: la mappa ti aspetta.",b:"Apri l'app",s:"Se il bottone non funziona, apri l'app Fawr in Paris dal telefono e accedi con la tua email."},
    fr:{t:"E-mail confirmé",p:"Ton compte Fawr in Paris est actif. Reviens dans l'appli et connecte-toi : la carte t'attend.",b:"Ouvrir l'appli",s:"Si le bouton ne marche pas, ouvre l'appli Fawr in Paris sur ton téléphone et connecte-toi avec ton e-mail."},
    en:{t:"Email confirmed",p:"Your Fawr in Paris account is active. Go back to the app and sign in: the map is waiting.",b:"Open the app",s:"If the button doesn't work, open the Fawr in Paris app on your phone and sign in with your email."}
  };
  function setLang(l){ var d=T[l]; document.documentElement.lang=l; document.querySelectorAll('[data-i]').forEach(function(e){ e.textContent=d[e.getAttribute('data-i')]; }); document.querySelectorAll('[data-l]').forEach(function(b){ b.setAttribute('aria-pressed', b.getAttribute('data-l')===l); }); }
  document.querySelectorAll('[data-l]').forEach(function(b){ b.addEventListener('click', function(){ setLang(b.getAttribute('data-l')); }); });
  var nav=(navigator.language||'it').slice(0,2); if(T[nav]) setLang(nav);
  // Se il link di conferma arriva con un errore (es. link scaduto), lo diciamo chiaramente.
  if (location.hash.indexOf('error') >= 0) { document.querySelector('[data-i="t"]').textContent = {it:"Link scaduto",fr:"Lien expiré",en:"Link expired"}[document.documentElement.lang]; document.querySelector('[data-i="p"]').textContent = {it:"Questo link non è più valido. Apri l'app e chiedi un nuovo link di conferma.",fr:"Ce lien n'est plus valable. Ouvre l'appli et demande un nouveau lien.",en:"This link is no longer valid. Open the app and request a new confirmation link."}[document.documentElement.lang]; }
</script>
</body>
</html>
